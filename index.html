<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zinfa Horse Academy Reservation</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #10b981;
            --bg: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .school-logo {
            width: 50px;
            height: auto;
            object-fit: contain;
        }
        h2 { 
            color: var(--primary); 
            margin: 0; 
            font-size: 24px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-radius: 0;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #334155; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: 2px solid var(--primary);
        }
        button.action-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.action-btn:hover { opacity: 0.9; }
        #message, #lookupMessage { margin-top: 15px; text-align: center; font-weight: 500; }

        /* Reservation Card Styles */
        .reservation-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 12px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-confirmed { background: #d1fae5; color: #059669; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }
        .card-detail { font-size: 13px; color: #475569; margin: 4px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <img src="logo.png" alt="School Logo" class="school-logo">
        <h2>Zinfa Horse Academy</h2>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('book')">New Booking</button>
        <button class="tab-btn" onclick="switchTab('lookup')">My Bookings</button>
    </div>

    <!-- Tab 1: Booking Form -->
    <div id="bookTab" class="tab-content active">
        <form id="bookingForm">
            <div class="input-group">
                <label>Google Email</label>
                <input type="email" id="email" required placeholder="student@email.com">
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required placeholder="e.g., +123456789">
            </div>
            <div class="input-group">
                <label>Student Names (Comma separated)</label>
                <input type="text" id="studentNames" required placeholder="John Doe, Jane Doe">
            </div>
            <div class="input-group">
                <label>Student Count</label>
                <input type="number" id="studentCount" min="1" required placeholder="1">
            </div>
            <div class="input-group">
                <label>Select Day</label>
                <input type="date" id="slotDay" required>
            </div>
            <div class="input-group">
                <label>Select Time Slot</label>
                <select id="slotTime" required>
                    <option value="">Choose a time...</option>
                    <option value="03:00 PM">03:00 PM</option>
                    <option value="04:00 PM">04:00 PM</option>
                    <option value="05:00 PM">05:00 PM</option>
                    <option value="06:00 PM">06:00 PM</option>
                    <option value="07:00 PM">07:00 PM</option>
                    <option value="08:00 PM">08:00 PM</option>
                    <option value="09:00 PM">09:00 PM</option>
                    <option value="10:00 PM">10:00 PM</option>
                </select>
            </div>
            <button type="submit" id="submitBtn" class="action-btn">Confirm Reservation</button>
            <div id="message"></div>
        </form>
    </div>

    <!-- Tab 2: Lookup Form -->
    <div id="lookupTab" class="tab-content">
        <div class="input-group">
            <label>Enter Your Email</label>
            <input type="email" id="lookupEmail" placeholder="student@email.com">
        </div>
        <button onclick="fetchReservations()" class="action-btn" id="lookupBtn">Check Reservations</button>
        <div id="lookupMessage"></div>
        <div id="reservationsList"></div>
    </div>
</div>

<script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbyYeb2Tc2LYu8-hrODZt0AWjtVFTDzesJ5uZNAqqswQyIeaZ0MYqu248boZ2xSbLMSR/exec';

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (tab === 'book') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('bookTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('lookupTab').classList.add('active');
        }
    }

    // Submit Reservation
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";
        messageDiv.innerText = "";

        const payload = {
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            studentNames: document.getElementById('studentNames').value,
            studentCount: parseInt(document.getElementById('studentCount').value),
            slotDay: document.getElementById('slotDay').value,
            slotTime: document.getElementById('slotTime').value
        };

        try {
            await fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            messageDiv.style.color = "green";
            messageDiv.innerText = "Reservation sent! An instructor will call you soon.";
            document.getElementById('bookingForm').reset();
        } catch (error) {
            messageDiv.style.color = "red";
            messageDiv.innerText = "Something went wrong. Please try again.";
            console.error(error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Confirm Reservation";
        }
    });

    // Lookup Reservations
    async function fetchReservations() {
        const email = document.getElementById('lookupEmail').value.trim();
        const msgDiv = document.getElementById('lookupMessage');
        const listDiv = document.getElementById('reservationsList');
        const lookupBtn = document.getElementById('lookupBtn');

        if (!email) {
            msgDiv.style.color = "red";
            msgDiv.innerText = "Please enter an email address.";
            return;
        }

        lookupBtn.disabled = true;
        lookupBtn.innerText = "Searching...";
        msgDiv.innerText = "";
        listDiv.innerHTML = "";

        try {
            const response = await fetch(`${scriptUrl}?email=${encodeURIComponent(email)}`);
            const data = await response.json();

            if (data.status === "success") {
                if (data.reservations.length === 0) {
                    msgDiv.style.color = "#64748b";
                    msgDiv.innerText = "No reservations found for this email.";
                } else {
                    renderReservations(data.reservations);
                }
            } else {
                msgDiv.style.color = "red";
                msgDiv.innerText = "Error loading reservations.";
            }
        } catch (err) {
            msgDiv.style.color = "red";
            msgDiv.innerText = "Failed to fetch reservations. Make sure your Apps Script web app is deployed with access set to 'Anyone'.";
            console.error(err);
        } finally {
            lookupBtn.disabled = false;
            lookupBtn.innerText = "Check Reservations";
        }
    }

    function renderReservations(reservations) {
        const listDiv = document.getElementById('reservationsList');
        listDiv.innerHTML = reservations.map(res => {
            const statusClass = res.status.toLowerCase() === 'confirmed' ? 'status-confirmed' : 
                               (res.status.toLowerCase() === 'cancelled' ? 'status-cancelled' : 'status-pending');
            return `
                <div class="reservation-card">
                    <div class="card-header">
                        <strong>${res.slotDay} @ ${res.slotTime}</strong>
                        <span class="status-badge ${statusClass}">${res.status}</span>
                    </div>
                    <div class="card-detail"><strong>Students:</strong> ${res.studentNames} (${res.studentCount})</div>
                    <div class="card-detail"><strong>Phone:</strong> ${res.phone}</div>
                </div>
            `;
        }).join('');
    }
</script>

</body>
</html>
